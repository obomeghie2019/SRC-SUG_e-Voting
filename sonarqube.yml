name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed for accurate PR analysis and blame

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io   # SonarQube Cloud (EU). US region: https://sonarqube.us
        with:
          # Wait for the quality gate result; the job fails if the gate fails,
          # which blocks the merge when this check is marked "required".
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300