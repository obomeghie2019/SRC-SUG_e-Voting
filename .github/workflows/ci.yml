name: CI

# Order of the jobs (each one starts only if the previous one passed):
#   1. SonarQube Quality Gate   runs the tests with coverage, then the SonarQube scan
#   2. Web build
#   3. Backend check
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Cancel outdated runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for accurate new-code detection

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install --prefer-binary -r backend/requirements.txt -r backend/requirements-dev.txt

      # Run from the repository root so coverage.xml lists "backend/core/otp.py" (the path SonarQube knows).
      # .coveragerc at the repo root sets relative_files and what is measured.
      - name: Run backend tests with coverage
        run: python -m pytest backend/tests -q -p no:cacheprovider --cov --cov-report=xml:coverage.xml

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  web:
    name: Web build
    needs: sonarqube
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build

  backend:
    name: Backend check
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install --prefer-binary -r requirements.txt -r requirements-dev.txt
      - name: Compile all modules
        run: python -m compileall -q core api_web api_mobile seed.py
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider