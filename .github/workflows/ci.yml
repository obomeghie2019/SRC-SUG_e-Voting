name: CI

# Order of the jobs (each one starts only if the previous one passed):
#   1. SonarQube Quality Gate   runs the tests with coverage, then the SonarQube scan
#   2. Web build
#   3. Backend check
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# No permissions by default; each job asks only for what it needs (see "permissions" in every job).
permissions: {}

# Cancel outdated runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for accurate new-code detection

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.lock

      # Exact versions, every file checked against its hash, wheels only (no setup scripts are run).
      # After changing backend/requirements*.txt, regenerate backend/requirements-ci.lock (command in its first lines).
      - name: Install backend dependencies
        run: |
          pip install --require-hashes --only-binary :all: --no-deps -r backend/requirements-ci.lock

      # Run from the repository root so coverage.xml lists "backend/core/otp.py" (the path SonarQube knows).
      # .coveragerc at the repo root sets relative_files and what is measured.
      - name: Run backend tests with coverage
        run: python -m pytest backend/tests -q -p no:cacheprovider --cov --cov-report=xml:coverage.xml

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      # Runs only when the scan step fails: prints WHICH quality gate conditions failed, right here in the log.
      # (Ratings: 1 = A, 2 = B, 3 = C, 4 = D, 5 = E.)
      - name: Show failed quality gate conditions
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: obomeghie2019_SRC-SUG_e-Voting
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$PR_NUMBER" ]; then SCOPE="pullRequest=$PR_NUMBER"; else SCOPE="branch=$BRANCH"; fi
          echo "Analysis checked: $SCOPE"
          curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT_KEY&$SCOPE" \
            | jq -r '.projectStatus | "Gate status: \(.status)", (.conditions[]? | select(.status == "ERROR") | "FAILED: \(.metricKey)  actual=\(.actualValue)  required \(.comparator) \(.errorThreshold)")'
          echo ""
          echo "Security and reliability issues in new code, most severe first (rule  file:line  [quality/severity]  message):"
          curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=$PROJECT_KEY&$SCOPE&issueStatuses=OPEN,CONFIRMED&inNewCodePeriod=true&impactSoftwareQualities=SECURITY,RELIABILITY&ps=200" \
            | jq -r '(.errors // [] | .[] | "API error: " + .msg), ((.issues // []) | map(. + {rank: ((.impacts // []) | map(select(.softwareQuality == "RELIABILITY" or .softwareQuality == "SECURITY") | ({"BLOCKER": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3, "INFO": 4}[.severity] // 5)) | min // 5)}) | sort_by(.rank) | .[] | select(.rank < 5) | "\(.rule)  \(.component | sub("^[^:]+:"; "")):\(.line // 0)  [\((.impacts // []) | map(.softwareQuality + "/" + .severity) | join(","))]  \(.message)")'

  web:
    name: Web build
    needs: sonarqube
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build

  backend:
    name: Backend check
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.lock
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: --no-deps -r requirements-ci.lock
      - name: Compile all modules
        run: python -m compileall -q core api_web api_mobile seed.py
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
