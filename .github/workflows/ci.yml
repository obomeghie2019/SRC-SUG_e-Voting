name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Cancel outdated runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  sonarqube:
    name: SonarQube Quality Gate
    # Needs the backend coverage report, so it starts after "Backend check" and runs alongside "Web build"
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Puts coverage.xml in the repo root, where sonar-project.properties expects it
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: .

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
  backend:
    name: Backend check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install --prefer-binary -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Compile all modules
        working-directory: backend
        run: python -m compileall -q core api_web api_mobile seed.py

      # Run from the REPOSITORY ROOT so coverage.xml lists files as "backend/core/otp.py",
      # which is how SonarQube knows them. (Run inside backend/ it lists bare names like "admin.py"
      # and SonarQube cannot match them, so coverage stays at 0% and the gate fails.)
      # .coveragerc at the repo root sets relative_files and what to measure.
      - name: Run tests with coverage
        run: python -m pytest backend/tests -q -p no:cacheprovider --cov --cov-report=xml:coverage.xml --durations=5

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 1
          compression-level: 0

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build














