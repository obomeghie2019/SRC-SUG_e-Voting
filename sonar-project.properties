sonar.organization=obomeghie2019
sonar.projectKey=obomeghie2019_SRC-SUG_e-Voting
sonar.projectName=SUG/SRC e-Voting System

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# What is analysed
sonar.sources=backend,web/src,mobile/lib
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/__pycache__/**,**/build/**,**/.dart_tool/**,backend/tests/**,**/coverage*.xml

# Test coverage comes from pytest (see .github/workflows/ci.yml and .coveragerc).
sonar.python.coverage.reportPaths=coverage.xml
# The React and Flutter code has no automated tests yet, so it is left out of the coverage figure
# (it is still scanned for bugs, vulnerabilities and code smells).
sonar.coverage.exclusions=web/**,mobile/**,backend/seed.py
